name: Session Cleanup

on:
  schedule:
    # Daily at 03:00 UTC. GitHub may delay or skip scheduled runs under
    # load, which is fine for a non-time-critical sweep (CLAUDE.md 27.4).
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

# The route's batched DELETE is idempotent, so an overlapping manual and
# scheduled run is harmless; serialising them is just belt-and-braces.
concurrency:
  group: session-cleanup
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # Passed via env (never interpolated into the script) so the secret
      # is not expanded inline in the shell command.
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Call session-cleanup route
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET repo secrets must both be set." >&2
            exit 1
          fi

          # --fail-with-body fails the job on a non-2xx (401/500) while still
          # printing the route's generic error body. Retries are safe because
          # the delete is idempotent.
          curl --silent --show-error --fail-with-body \
            --max-time 60 --retry 2 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/session-cleanup"
          echo
