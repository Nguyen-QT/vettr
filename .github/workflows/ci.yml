name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vettr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vettr_test?schema=public
      # Non-secret placeholders -- nothing in the unit test suite makes
      # a real Stripe/UploadThing call (Stripe is mocked at the module
      # boundary per-test), these just need to be non-empty strings so
      # nothing throws at module-load time.
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_PUBLISHABLE_KEY: pk_test_dummy
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      UPLOADTHING_TOKEN: dummy_uploadthing_token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - name: Generate Next.js route types
        # tsc otherwise fails on the ambient `LayoutProps`/`PageProps`
        # types Next.js normally writes to .next/types/ during `next
        # dev`/`next build` -- a fresh checkout never has that
        # directory, only a local one that's already run the dev
        # server does, which is exactly why this only failed in CI.
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npm run test

  stripe-integration-tests:
    runs-on: ubuntu-latest

    # CLAUDE.md 14.1.5: `secrets.STRIPE_SECRET_KEY` isn't available to a
    # workflow run triggered from a fork's pull request, so this job
    # would otherwise fail there for a reason unrelated to the code
    # itself. Skipping it in that case (rather than failing) means only
    # a push/PR from within this repo -- where the secret is present --
    # actually runs and blocks on these tests.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vettr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vettr_test?schema=public
      # The real test-mode secret (a GitHub Actions repo secret), unlike
      # the `test` job's non-secret placeholder above -- these tests
      # make real, unmocked calls against Stripe's test-mode API.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: pk_test_dummy
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      UPLOADTHING_TOKEN: dummy_uploadthing_token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - name: Stripe test-mode integration tests
        run: npm run test:stripe

  e2e-tests:
    runs-on: ubuntu-latest

    # deposit-payment.spec.ts clicks "Pay deposit" and asserts a real
    # Stripe Elements "Confirm payment" button mounts -- needs the same
    # real test-mode secret/publishable key as stripe-integration-tests,
    # unavailable to a workflow run triggered from a fork's pull
    # request, so this job is skipped there for the same reason (CLAUDE.md
    # 14.1.5).
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vettr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vettr_test?schema=public
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      # No real webhook delivery is possible or needed here -- Stripe's
      # servers can't reach a CI runner, and no spec depends on a
      # webhook actually firing (CLAUDE.md 14.2).
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      UPLOADTHING_TOKEN: dummy_uploadthing_token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - name: Install Playwright browsers
        # Only chromium -- the only project configured in
        # playwright.config.ts.
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
